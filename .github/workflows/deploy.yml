name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *' # 매일 06:20 KST

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore last validated data
        uses: actions/cache/restore@v4
        with:
          path: .refresh-cache
          key: model-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: model-data-v1-

      - name: Validate and preserve reviewed provider snapshot (no collection)
        run: npm run data:refresh

      - name: Validate normalized snapshot
        run: npm run data:validate

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Persist last validated data for the next run
        uses: actions/cache/save@v4
        with:
          path: .refresh-cache
          key: model-data-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
